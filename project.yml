name: Dropshot
options:
  bundleIdPrefix: app.dropshot
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  DropshotCore:
    path: Packages/DropshotCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  LaunchAtLogin:
    url: https://github.com/sindresorhus/LaunchAtLogin-Modern
    from: 1.1.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  Dropshot:
    type: application
    platform: macOS
    sources:
      - path: Dropshot
        excludes:
          - Info.plist
    dependencies:
      - package: DropshotCore
      - package: Sparkle
      - package: LaunchAtLogin
    info:
      path: Dropshot/Info.plist
      properties:
        CFBundleName: Dropshot
        CFBundleDisplayName: Dropshot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "© 2026 Dropshot"
        NSPrincipalClass: NSApplication
        # Sparkle. Replace both before the first public release (see RELEASING.md).
        # While SUFeedURL is empty the updater is not started and no network call is made.
        SUFeedURL: $(SPARKLE_FEED_URL)
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUEnableInstallerLauncherService: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dropshot.Dropshot
        PRODUCT_NAME: Dropshot
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_STRICT_CONCURRENCY: complete
        DEAD_CODE_STRIPPING: YES
        SPARKLE_FEED_URL: ""
        SPARKLE_PUBLIC_ED_KEY: ""
      configs:
        Release:
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
          SWIFT_COMPILATION_MODE: wholemodule

schemes:
  Dropshot:
    build:
      targets:
        Dropshot: all
    run:
      config: Debug
    archive:
      config: Release
